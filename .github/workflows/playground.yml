name: playground-smoke

# Manual + nightly only — never on PRs, so normal CI stays fast.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"  # 03:00 UTC daily

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false          # a 19 failure must not mask the 18 result
      matrix:
        odoo_image: ["odoo:18", "odoo:19"]
    name: smoke (${{ matrix.odoo_image }})
    env:
      ODOO_IMAGE: ${{ matrix.odoo_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install odoo-pulse
        run: pip install -e .
      - name: Run playground smoke
        run: ./scripts/smoke/playground.sh
