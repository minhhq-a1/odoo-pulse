name: release

# The only workflow that publishes on a tag push. Nothing here is reachable
# without an immutable `vX.Y.Z` or `vX.Y.ZrcN` tag, and each channel runs only
# after the previous one succeeded:
#
#   validate -> build -> PyPI -> Docker -> GitHub Release
#
# Publishing to PyPI uses Trusted Publishing (OIDC) — no API token is stored.
#
# One-time setup (owner, on PyPI):
#   PyPI > your project > Publishing > Add a trusted publisher (GitHub Actions)
#     Owner:            minhhq-a1
#     Repository:       odoo-pulse
#     Workflow name:    release.yml
#     Environment name: pypi

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.identity.outputs.version }}
      semver_version: ${{ steps.identity.outputs.semver_version }}
      tag: ${{ steps.identity.outputs.tag }}
      prerelease: ${{ steps.identity.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Resolve and validate the release identity
        id: identity
        run: |
          python scripts/release/release_contract.py identity \
            --root . --tag "$GITHUB_REF_NAME" --github-output "$GITHUB_OUTPUT"
          python scripts/release/sync_version.py --check

  build:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned release tooling
        run: python -m pip install "build>=1.2" "twine>=6,<7"
      - name: Build sdist and wheel exactly once
        run: python -m build
      - name: Check the built distributions
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          python -m twine check \
            "dist/odoo_pulse-${VERSION}-py3-none-any.whl" \
            "dist/odoo_pulse-${VERSION}.tar.gz"
      - name: Assert the archive layout
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          test -f "dist/odoo_pulse-${VERSION}-py3-none-any.whl"
          test -f "dist/odoo_pulse-${VERSION}.tar.gz"
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1
      - name: Record artifact hashes
        run: |
          cd dist
          sha256sum ./*.whl ./*.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Drop non-distribution files before upload
        run: rm -f dist/SHA256SUMS.txt
      - name: Publish to PyPI
        # Deliberately no option here to tolerate already-published filenames:
        # a filename that already exists on PyPI means this tag is republishing
        # content, which is a provenance failure rather than a no-op.
        uses: pypa/gh-action-pypi-publish@release/v1

  docker:
    needs: [validate, publish-pypi]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      release_ref: ${{ needs.validate.outputs.tag }}
      version: ${{ needs.validate.outputs.version }}
      push_image: true

  release-record:
    needs: [validate, build, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create the GitHub Release
        run: |
          TAG="${{ needs.validate.outputs.tag }}"
          VERSION="${{ needs.validate.outputs.version }}"
          if [ "${{ needs.validate.outputs.prerelease }}" = "true" ]; then
            gh release create "$TAG" \
              --title "odoo-pulse $VERSION" \
              --notes-file docs/releases/v1.9.0.md \
              --prerelease \
              "dist/odoo_pulse-${VERSION}-py3-none-any.whl" \
              "dist/odoo_pulse-${VERSION}.tar.gz" \
              dist/SHA256SUMS.txt
          else
            gh release create "$TAG" \
              --title "odoo-pulse $VERSION" \
              --notes-file docs/releases/v1.9.0.md \
              "dist/odoo_pulse-${VERSION}-py3-none-any.whl" \
              "dist/odoo_pulse-${VERSION}.tar.gz" \
              dist/SHA256SUMS.txt
          fi
