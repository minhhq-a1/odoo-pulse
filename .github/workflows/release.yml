name: release

# The only workflow that publishes on a tag push. Nothing here is reachable
# without an immutable `vX.Y.Z` or `vX.Y.ZrcN` tag, and each channel runs only
# after the previous one succeeded:
#
#   validate -> build -> PyPI -> Docker -> GitHub Release
#
# Publishing to PyPI uses Trusted Publishing (OIDC) — no API token is stored.
#
# One-time setup (owner, on PyPI):
#   PyPI > your project > Publishing > Add a trusted publisher (GitHub Actions)
#     Owner:            minhhq-a1
#     Repository:       odoo-pulse
#     Workflow name:    release.yml
#     Environment name: pypi

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.identity.outputs.version }}
      semver_version: ${{ steps.identity.outputs.semver_version }}
      tag: ${{ steps.identity.outputs.tag }}
      prerelease: ${{ steps.identity.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Resolve and validate the release identity
        id: identity
        run: |
          python scripts/release/release_contract.py identity \
            --root . --tag "$GITHUB_REF_NAME" --github-output "$GITHUB_OUTPUT"
          python scripts/release/sync_version.py --check

      - name: Require the release notes for this tag
        env:
          TAG: ${{ steps.identity.outputs.tag }}
        run: |
          # release-record is the last job, so a missing notes file would only
          # surface after PyPI and GHCR had already published irreversibly.
          test -f "docs/releases/${TAG}.md" || {
            echo "::error::docs/releases/${TAG}.md is missing; refusing to start a release that cannot be recorded" >&2
            exit 1
          }

  build:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install pinned release tooling
        run: python -m pip install "build>=1.2" "twine>=6,<7"
      - name: Build sdist and wheel exactly once
        run: python -m build
      - name: Check the built distributions
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python -m twine check \
            "dist/odoo_pulse-${VERSION}-py3-none-any.whl" \
            "dist/odoo_pulse-${VERSION}.tar.gz"
      - name: Assert the archive layout
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          test -f "dist/odoo_pulse-${VERSION}-py3-none-any.whl"
          test -f "dist/odoo_pulse-${VERSION}.tar.gz"
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1
      - name: Record artifact hashes
        run: |
          cd dist
          sha256sum ./*.whl ./*.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Drop non-distribution files before upload
        run: |
          # The publish action globs the whole directory and hands every file to
          # twine, which rejects a checksums file as an unknown distribution.
          # Assert before removing: a missing file means the build job changed,
          # and release-record needs it after PyPI has already published.
          test -f dist/SHA256SUMS.txt
          rm dist/SHA256SUMS.txt
      - name: Publish to PyPI
        # Deliberately no option here to tolerate already-published filenames:
        # a filename that already exists on PyPI means this tag is republishing
        # content, which is a provenance failure rather than a no-op.
        #
        # This is the only step holding `id-token: write` against our PyPI
        # Trusted Publisher identity, so it gets the strictest pin in the repo.
        # Upstream advertises the curated `release/v1` branch and publishes no
        # `v1` tag alias, so the two candidates were that branch's head and a
        # release tag. Pinned to the v1.14.1 tag's commit: today it is the same
        # commit release/v1 points at, but a branch head is mutable and a tag's
        # commit is not, so this is the reproducible half of the pair.
        # Dependabot re-resolves it weekly (.github/dependabot.yml).
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1

  docker:
    needs: [validate, publish-pypi]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      release_ref: ${{ needs.validate.outputs.tag }}
      version: ${{ needs.validate.outputs.version }}
      push_image: true

  release-record:
    needs: [validate, build, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Require a pushed container image
        env:
          DIGEST: ${{ needs.docker.outputs.digest }}
        run: |
          # The release notes advertise a container image, so refuse to record a
          # release unless the Docker job actually reported a registry digest.
          test -n "$DIGEST" || {
            echo "::error::the Docker job reported no registry digest; no image was pushed" >&2
            exit 1
          }
          echo "Pushed image digest: $DIGEST"

      - name: Create the GitHub Release
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          # Fail closed: anything other than an explicit true/false aborts
          # rather than silently publishing an RC as a stable release.
          case "$PRERELEASE" in
            true) FLAGS=(--prerelease) ;;
            false) FLAGS=() ;;
            *)
              echo "::error::unexpected prerelease value '$PRERELEASE'" >&2
              exit 1
              ;;
          esac
          gh release create "$TAG" \
            --title "odoo-pulse $VERSION" \
            --notes-file "docs/releases/${TAG}.md" \
            "${FLAGS[@]}" \
            "dist/odoo_pulse-${VERSION}-py3-none-any.whl" \
            "dist/odoo_pulse-${VERSION}.tar.gz" \
            dist/SHA256SUMS.txt
