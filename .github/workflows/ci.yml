name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# This workflow runs on every branch push, so it holds the broadest-reach token
# in the repository. It only reads and tests, so deny everything else.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest -q

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade build
          python -m build --outdir "$RUNNER_TEMP/dist"

      - name: Smoke-test built wheel
        run: |
          python -m venv --system-site-packages "$RUNNER_TEMP/odoo-pulse-wheel"
          "$RUNNER_TEMP/odoo-pulse-wheel/bin/pip" install --no-deps "$RUNNER_TEMP"/dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/odoo-pulse-wheel/bin/python" -c 'import asyncio; from odoo_pulse import server; from odoo_pulse.mcp.app import mcp; tools = asyncio.run(mcp.list_tools()); assert len(tools) == 31'

  mcp-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
      - name: Build wheel
        run: |
          python -m pip install --upgrade build
          python -m build --outdir "$RUNNER_TEMP/dist"
      - name: Install exact MCP floor and wheel
        run: |
          python -m venv "$RUNNER_TEMP/odoo-pulse-floor"
          "$RUNNER_TEMP/odoo-pulse-floor/bin/pip" install \
            "mcp[cli]==1.3.0" "$RUNNER_TEMP"/dist/*.whl
      - name: Probe default surface at MCP floor
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/odoo-pulse-floor/bin/python" \
            "$GITHUB_WORKSPACE/tests/integration/mcp_surface_probe.py" \
            --groups core,reports --expected-tools 31 --expected-resources 1 \
            --expected-sdk 1.3.0 --require-instructions
      - name: Probe complete surface at MCP floor
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/odoo-pulse-floor/bin/python" \
            "$GITHUB_WORKSPACE/tests/integration/mcp_surface_probe.py" \
            --groups all --expected-tools 88 --expected-resources 1 \
            --expected-sdk 1.3.0 --require-instructions
