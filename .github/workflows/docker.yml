name: docker

# Build, introspect, and optionally publish the MCP server image to GHCR
# (ghcr.io/minhhq-a1/odoo-pulse), which backs the docker-run install recipe.
#
# This workflow never triggers itself on a tag. `release.yml` calls it, and a
# maintainer can dispatch it manually with push_image=false as a preflight. The
# image that gets pushed is byte-for-byte the image that passed the probe.

on:
  workflow_call:
    inputs:
      release_ref:
        required: true
        type: string
      version:
        required: true
        type: string
      push_image:
        required: true
        type: boolean
    outputs:
      digest:
        description: Registry digest of the pushed version tag; empty on preflight
        value: ${{ jobs.push_image.outputs.digest }}
  workflow_dispatch:
    inputs:
      release_ref:
        description: Release tag, branch, or FULL 40-character SHA (short SHAs fail)
        required: true
        type: string
      version:
        description: Canonical PEP 440 project version
        required: true
        type: string
      push_image:
        description: Push the probed image to GHCR
        required: true
        default: false
        type: boolean

env:
  IMAGE: ghcr.io/minhhq-a1/odoo-pulse

jobs:
  build-probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_ref }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Validate release identity of the built ref
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python scripts/release/release_contract.py identity \
            --root . --tag "v${VERSION}"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=auto
          tags: |
            type=pep440,pattern={{version}},value=${{ inputs.version }}
            type=pep440,pattern={{major}}.{{minor}},value=${{ inputs.version }}
            type=pep440,pattern={{major}},value=${{ inputs.version }}

      - name: Check exact Docker aliases
        env:
          VERSION: ${{ inputs.version }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          python scripts/release/release_contract.py check-docker-tags \
            --version "$VERSION" --actual "$TAGS"

      - name: Build image once without pushing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Probe MCP surface
        env:
          VERSION: ${{ inputs.version }}
        run: |
          docker run --rm --entrypoint python \
            "${IMAGE}:${VERSION}" -c '
          import asyncio, json
          from odoo_pulse import server  # noqa: F401
          from odoo_pulse.mcp.app import mcp

          async def main():
              tools = await mcp.list_tools()
              resources = sorted(
                  str(t.uriTemplate) for t in await mcp.list_resource_templates()
              )
              assert len(tools) == 31, (len(tools), sorted(t.name for t in tools))
              assert resources == ["odoo://{model}/{id}"], resources
              print(json.dumps({"tools": len(tools), "resources": resources}))

          asyncio.run(main())
          '

      - name: Save the exact probed image set
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          printf '%s\n' "$TAGS" > tags.txt
          docker save -o image.tar $(tr '\n' ' ' < tags.txt)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-image-${{ inputs.version }}
          path: |
            image.tar
            tags.txt
          retention-days: 7
          if-no-files-found: error

  push_image:
    # The underscore in this job ID is deliberate: the contract tests select the
    # parsed job and must not confuse it with the `push: false` build input.
    if: inputs.push_image
    needs: build-probe
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-image-${{ inputs.version }}

      - name: Load the probed image
        run: docker load -i image.tar

      - name: Verify the loaded set is exactly the probed set
        run: |
          docker images --format '{{ .Repository }}:{{ .Tag }}' \
            | grep "^${IMAGE}:" | sort > loaded.txt
          sort tags.txt > probed.txt
          diff probed.txt loaded.txt

      - name: Log in to GHCR
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the probed image
        run: docker push --all-tags ghcr.io/minhhq-a1/odoo-pulse

      - name: Inspect the immutable version tag
        env:
          VERSION: ${{ inputs.version }}
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"

      - name: Verify every published alias resolves to the probed image
        id: digest
        run: |
          # docker push --all-tags does not reliably fail per tag, so a partial
          # push could leave a moving alias such as latest stale while this job
          # still reported success. Confirm each recorded alias in the registry.
          digest=""
          while read -r ref; do
            [ -n "$ref" ] || continue
            actual="$(docker buildx imagetools inspect "$ref" \
              --format '{{ .Manifest.Digest }}')"
            test -n "$actual"
            if [ -z "$digest" ]; then
              digest="$actual"
            elif [ "$actual" != "$digest" ]; then
              echo "::error::$ref resolves to $actual, expected $digest" >&2
              exit 1
            fi
            echo "$ref -> $actual"
          done < tags.txt
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
